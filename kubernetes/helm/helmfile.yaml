repositories:
  - name: external-dns
    url: https://kubernetes-sigs.github.io/external-dns

  - name: argo
    url: https://argoproj.github.io/argo-helm

  - name: mariadb-operator
    url: https://mariadb-operator.github.io/mariadb-operator

releases:
  - name: external-dns
    namespace: external-dns
    chart: external-dns/external-dns
    version: 1.23.0
    values:
      - values/external-dns.yaml

  - name: argo
    namespace: argocd
    chart: argo/argo-cd
    version: 9.5.11
    values:
      - values/argo.yaml

  - name: mariadb-operator-crds
    namespace: mariadb-operator
    chart: mariadb-operator/mariadb-operator-crds
    version: 26.10.1

  - name: mariadb-operator
    namespace: mariadb-operator
    chart: mariadb-operator/mariadb-operator
    version: 26.10.1
    needs:
      - mariadb-operator/mariadb-operator-crds
